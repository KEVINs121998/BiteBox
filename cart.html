<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteBox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="images/favicon_io/favicon.ico">
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&display=swap" rel="stylesheet">
</head>     
<body>
    <header>
        <nav>
            <a href="home.html"><img src="images/logo.png" alt="logo" width="180px"></a>
            <ul>
                <li><a href="Home.html" class="active">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="bitedeals.html">Bitedeals</a></li>
                <li><a href="cart.html"><i class="fa-solid fa-cart-plus"></i></a></li>
                <li><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i>Login</a></li>
            </ul>
        </nav>
    </header>

    <section class="cart">
    <table>
        <thead>
            <th>Item</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Total</th>
            <th>Remove</th>
        </thead>

    <tbody>
        <tr>
            <td class="item">
                <img src="images/burger.jpg" alt="burger">
                <div>
                    <h4>Cheesy burger</h4>
                    <p>Juicy griled burger</p>
                </div>
            </td>
            <td>Rs 199</td>
            <td>
                <div class="qty-box">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>
            </td>
            <td>Rs 199</td>
            <td><button class="remove">X</button></td>
        </tr>

           <tr>
            <td class="item">
                <img src="images/pasta.avif" alt="pasta">
                <div>
                    <h4>Pasta</h4>
                    <p>Pink Sauce Pasta</p>
                </div>
            </td>
            <td>Rs 399</td>
            <td>
                <div class="qty-box">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>
            </td>
            <td>Rs 399</td>
            <td><button class="remove">X</button></td>
        </tr>

           <tr>
            <td class="item">
                <img src="images/paneer pizza.webp" alt="pizza">
                <div>
                    <h4>Paneer Pizza</h4>
                    <p>veggie loaded Pizza</p>
                </div>
            </td>
            <td>Rs 290</td>
            <td>
                <div class="qty-box">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>
            </td>
            <td>Rs 290</td>
            <td><button class="remove">X</button></td>
        </tr>
        <tr class="grand-total" style="border-bottom: 0px;">
            <td colspan="3">Grand Total</td>
            <td>Rs 199</td>
            <td><button>Proceed</button></td>
        </tr>
    </tbody>
    </table>
</section>
</body>
</html>
